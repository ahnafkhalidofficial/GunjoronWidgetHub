name: Build APK (from zip)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: কোড চেকআউট
        uses: actions/checkout@v5

      - name: জিপ খুঁজে এক্সট্র্যাক্ট
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::রিপোর root-এ কোনো .zip ফাইল পাওয়া যায়নি। জিপটি আপলোড করুন।"
            exit 1
          fi
          echo "জিপ পাওয়া গেছে: $ZIP"
          mkdir -p src
          unzip -q "$ZIP" -d src
          SETTINGS=$(find src -name 'settings.gradle*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::জিপের ভেতরে settings.gradle.kts পাওয়া যায়নি।"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "প্রজেক্ট ফোল্ডার: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: JDK 17 সেটআপ
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK রানারে আগে থেকেই ইনস্টল করা আছে (setup-android লাগবে না)
      - name: Android SDK লাইসেন্স গ্রহণ
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle 8.7 সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Debug APK বিল্ড
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: GunjoronWidgetHub-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
